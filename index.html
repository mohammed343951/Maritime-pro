<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maritime Pro | اختبار الملاحة الاحترافي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #000000;
            --card-bg: rgba(20, 20, 25, 0.7);
            --text-main: #f5f5f7;
            --text-secondary: #a1a1a6;
            --accent-blue: #0A84FF;
            --accent-hover: #0070E0;
            --success: #32d74b;
            --danger: #ff453a;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(25px);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1494412574643-ff11b0a5c1c3?q=80&w=2070&auto=format&fit=crop') center/cover fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 800px;
            max-width: 100%;
            overflow: hidden;
            position: relative;
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 60px; /* لترك مساحة للحقوق أسفل الشاشة */
        }

        .glass-card.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .landing-header { text-align: center; padding: 40px 20px 20px; }
        .landing-header h1 { font-size: 2.2rem; margin: 0 0 10px; background: linear-gradient(90deg, #fff, #a1a1a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .landing-header p { color: var(--text-secondary); font-size: 1.1rem; }
        .setup-section { padding: 20px 40px 40px; }
        .section-title { font-size: 1.1rem; margin-bottom: 15px; color: #fff; font-weight: 600; }

        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 15px; border-radius: 16px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .cat-btn:hover { background: rgba(255,255,255,0.1); }
        .cat-btn.selected { background: var(--accent-blue); border-color: var(--accent-blue); box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4); }
        .cat-btn.full-quiz { grid-column: 1 / -1; background: linear-gradient(135deg, #0A84FF, #32d74b); border: none; font-size: 1.1rem; }

        .time-input-wrapper { display: flex; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 16px; padding: 5px 15px; margin-bottom: 30px; }
        .time-input-wrapper input { background: transparent; border: none; color: #fff; font-size: 1.2rem; font-family: inherit; padding: 10px; width: 100%; outline: none; }
        .time-input-wrapper span { color: var(--text-secondary); white-space: nowrap; }

        .start-btn { background: var(--text-main); color: #000; border: none; border-radius: 980px; width: 100%; font-size: 1.3rem; font-weight: 800; padding: 18px; cursor: pointer; transition: all 0.3s; }
        .start-btn:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(255,255,255,0.2); }

        .progress-line-container { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; }
        .progress-correct { height: 100%; background: var(--success); width: 0%; transition: width 0.6s; }
        .progress-wrong { height: 100%; background: var(--danger); width: 0%; transition: width 0.6s; }

        .stats-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 32px 10px; font-size: 0.95rem; color: var(--text-secondary); font-weight: 600; }
        .timer-badge { background: rgba(255,69,58,0.1); color: var(--danger); border: 1px solid var(--danger); padding: 6px 15px; border-radius: 20px; font-family: monospace; font-size: 1.1rem; letter-spacing: 1px; box-shadow: 0 0 10px rgba(255,69,58,0.2); }

        .quiz-body { padding: 10px 32px 32px; }
        h2 { text-align: center; font-size: 1.4rem; font-weight: 800; line-height: 1.5; margin-bottom: 2rem; }
        
        ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        ul li { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 16px 20px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; }
        input[type="radio"] { display: none; }
        ul li:not(.disabled):hover { background: rgba(255, 255, 255, 0.08); transform: scale(1.01); border-color: rgba(255, 255, 255, 0.2); }

        .correct-answer { background: rgba(50,215,75,0.1) !important; border-color: var(--success) !important; color: var(--success) !important; }
        .wrong-answer { background: rgba(255,69,58,0.1) !important; border-color: var(--danger) !important; color: var(--danger) !important; }
        .disabled { pointer-events: none; opacity: 0.6; }
        .correct-answer.disabled, .wrong-answer.disabled { opacity: 1; }

        .action-btn { margin-top: 30px; background: var(--accent-blue); color: #ffffff; border: none; border-radius: 980px; width: 100%; font-size: 1.2rem; font-weight: 800; padding: 16px; cursor: pointer; transition: all 0.3s; }
        .action-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .result-body { text-align: center; padding: 4rem 2rem; }
        .result-body h1 { font-size: 3rem; margin-bottom: 10px; }
        .score-box { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; margin: 20px auto; max-width: 300px; border: 1px solid var(--border-color); }
        .score-box div { font-size: 1.2rem; margin: 10px 0; }

        /* تنسيق قسم الحقوق (Footer) */
        .site-footer {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 10;
        }
        .site-footer span.creator-name {
            color: var(--accent-blue);
            font-weight: 800;
            text-shadow: 0 0 10px rgba(10, 132, 255, 0.4);
        }
        
    </style>
</head>
<body>

    <!-- 1. واجهة الدخول -->
    <div id="landing-screen" class="glass-card active">
        <div class="landing-header">
            <h1>Maritime Pro Assessment ⚓</h1>
            <p>منصة التقييم الاحترافية للضباط والقباطنة</p>
        </div>
        <div class="setup-section">
            <div class="section-title">اختر قسم الاختبار:</div>
            <div class="category-grid" id="category-grid">
                <button class="cat-btn full-quiz selected" data-cat="all">شامل (جميع الأقسام - 70 سؤال)</button>
                <button class="cat-btn" data-cat="law">القانون البحري</button>
                <button class="cat-btn" data-cat="isps">مدونة ISPS</button>
                <button class="cat-btn" data-cat="stcw">اتفاقية STCW</button>
                <button class="cat-btn" data-cat="mlc">اتفاقية MLC</button>
                <button class="cat-btn" data-cat="marpol">اتفاقية MARPOL</button>
                <button class="cat-btn" data-cat="ism">نظام ISM</button>
            </div>

            <div class="section-title">إعداد المؤقت الزمني:</div>
            <div class="time-input-wrapper">
                <input type="number" id="time-input" min="0" placeholder="مثال: 30 (اتركه فارغاً لإلغاء المؤقت)">
                <span>دقيقة</span>
            </div>

            <button class="start-btn" onclick="startAssessment()">بدء التقييم الآن</button>
        </div>
    </div>

    <!-- 2. واجهة الاختبار -->
    <div id="quiz-screen" class="glass-card">
        <div class="progress-line-container">
            <div class="progress-correct" id="bar-correct"></div>
            <div class="progress-wrong" id="bar-wrong"></div>
        </div>

        <div class="stats-header">
            <div id="progress-text">السؤال 1 / 70</div>
            <div id="timer-display" class="timer-badge" style="display: none;">00:00</div>
        </div>
        
        <div class="quiz-body">
            <h2 id="question">جاري تحميل السؤال...</h2>
            <ul id="options-list">
                <li id="li_A" onclick="selectOption('A')">
                    <input type="radio" name="answer" id="A" class="answer">
                    <label for="A" id="a_text">الخيار الأول</label>
                </li>
                <li id="li_B" onclick="selectOption('B')">
                    <input type="radio" name="answer" id="B" class="answer">
                    <label for="B" id="b_text">الخيار الثاني</label>
                </li>
                <li id="li_C" onclick="selectOption('C')">
                    <input type="radio" name="answer" id="C" class="answer">
                    <label for="C" id="c_text">الخيار الثالث</label>
                </li>
                <li id="li_D" onclick="selectOption('D')">
                    <input type="radio" name="answer" id="D" class="answer">
                    <label for="D" id="d_text">الخيار الرابع</label>
                </li>
            </ul>
            <button id="submit-btn" class="action-btn">تأكيد الإجابة</button>
        </div>
    </div>

    <!-- 3. واجهة النتيجة -->
    <div id="result-screen" class="glass-card">
        <div class="result-body">
            <h1 id="result-title">اكتمل التقييم</h1>
            <p id="result-msg" style="color: var(--text-secondary); font-size: 1.2rem;"></p>
            
            <div class="score-box">
                <div style="color: var(--text-main);">إجمالي الأسئلة: <b id="res-total">0</b></div>
                <div style="color: var(--success);">إجابات صحيحة: <b id="res-correct">0</b></div>
                <div style="color: var(--danger);">إجابات خاطئة: <b id="res-wrong">0</b></div>
            </div>
            
            <h2 id="final-percentage" style="font-size: 2.5rem; margin: 20px 0;">%0</h2>
            
            <button class="start-btn" onclick="resetQuiz()" style="max-width: 300px; margin: 0 auto; display: block;">العودة للقائمة الرئيسية</button>
        </div>
    </div>

    <!-- قسم الحقوق واسم المنشئ -->
    <div class="site-footer">
        © 2026 جميع الحقوق محفوظة | تم الإنشاء بواسطة <span class="creator-name">Mohammed Frhan</span>
    </div>

    <script>

            { q: "ما سبب إدخال ISPS Code إلى اتفاقية SOLAS؟", A: "بسبب مشاكل التلوث البحري", B: "بعد حوادث اصطدام متكررة", C: "نتيجة لهجمات 11 سبتمبر 2001 في أمريكا", D: "بطلب من شركات التأمين", correct: "C", cat: "isps" },
            { q: "ما هو الحدث الذي شكل الدافع الأساسي لاعتماد مدونة ISPS؟", A: "حوادث تسرب النفط", B: "حوادث الغرق الجماعي", C: "الهجمات الإرهابية في 11 سبتمبر 2001", D: "القرصنة في القرن الإفريقي", correct: "C", cat: "isps" },
            { q: "ما نوع المدونة التي يُصنّف تحتها ISPS Code؟", A: "مدونة تقنية", B: "مدونة أمنية", C: "مدونة بيئية", D: "مدونة طبية", correct: "B", cat: "isps" },
            { q: "من الجهات التي يشملها تطبيق ISPS Code؟", A: "فقط السفن التجارية", B: "فقط الموانئ الكبيرة", C: "الحكومات، شركات النقل، السفن، والمرافئ", D: "المسافرين عبر البحر", correct: "C", cat: "isps" },
            { q: "ما أهمية ISPS Code في النقل البحري؟", A: "تنظيم حركة السفن في الموانئ", B: "تقليل عدد أفراد الطاقم", C: "حماية السفن والموانئ من المخاطر الأمنية", D: "تسريع عمليات الشحن والتفريغ", correct: "C", cat: "isps" },
            { q: "ما المقصود بالجزء 'A' من ISPS Code؟", A: "تعليمات غير ملزمة", B: "أحكام اختيارية حسب الدولة", C: "أحكام إلزامية", D: "توجيهات خاصة بالركاب", correct: "C", cat: "isps" },
            { q: "ما المقصود بالجزء 'B' من ISPS Code؟", A: "قوانين صارمة يجب اتباعها", B: "توصيات وأحكام استرشادية", C: "مواد تدريبية", D: "نصوص خاصة بالركاب", correct: "B", cat: "isps" },
            { q: "من الجهات الملزمة بتطبيق الجزء A من المدونة؟", A: "فقط السفن", B: "فقط المرافئ", C: "جميع الدول الأعضاء في الاتفاقية", D: "شركات التأمين فقط", correct: "C", cat: "isps" },
            { q: "كيف يتم استخدام الجزء B من المدونة؟", A: "كتفسير للقوانين الجنائية", B: "لتقديم التوجيهات لتطبيق الجزء A", C: "كبديل عن الجزء A", D: "في حالات الطوارئ فقط", correct: "B", cat: "isps" },
            { q: "هل الدول ملزمة بتطبيق الجزء B من المدونة؟", A: "نعم، التطبيق إجباري تماما", B: "لا، التطبيق اختياري ويعتمد على ظروف الدولة", C: "فقط في حال وجود تهديد", D: "فقط للسفن الدولية", correct: "B", cat: "isps" },
            { q: "متى دخلت ISPS Code حيز التنفيذ؟", A: "1 يناير 2000", B: "1 يوليو 2004", C: "1 سبتمبر 2002", D: "11 سبتمبر 2001", correct: "B", cat: "isps" },
            { q: "ما هي أهم العناصر التي تتطلبها ISPS Code في السفن والمرافئ؟", A: "زيادة عدد أفراد الطاقم", B: "وجود نظام أمني موثق", C: "إنشاء مكاتب حكومية على السفن", D: "تغيير أعلام السفن", correct: "B", cat: "isps" },
            { q: "من الجهات المسؤولة عن مراقبة تطبيق ISPS Code؟", A: "شركات الشحن فقط", B: "الموانئ المحلية", C: "الدول الأعضاء في SOLAS", D: "شركات الأمن الخاصة", correct: "C", cat: "isps" },
            { q: "هل تسري ISPS Code على السفن الصغيرة الخاصة؟", A: "نعم، بدون استثناء", B: "لا، تسري فقط على الكبيرة", C: "تسري على السفن الخاضعة لاتفاقية SOLAS فقط", D: "تسري على الزوارق الترفيهية", correct: "C", cat: "isps" },

            // STCW
            { q: "متى تم اعتماد اتفاقية STCW؟", A: "1984", B: "1995", C: "1978", D: "2010", correct: "C", cat: "stcw" },
            { q: "ما هو الهدف الأساسي من اتفاقية STCW؟", A: "حماية البيئة البحرية", B: "تحديد ساعات العمل للضباط", C: "وضع معايير التدريب والإجازة والخفارة", D: "تحسين الملاحة الإلكترونية", correct: "C", cat: "stcw" },
            { q: "دخلت اتفاقية STCW حيز التنفيذ في:", A: "1995", B: "1984", C: "1978", D: "2012", correct: "B", cat: "stcw" },
            { q: "أحد عيوب نسخة 1978 من الاتفاقية هو:", A: "تجاهل التدريب العملي", B: "اعتماد الممارسات الاحتيالية", C: "ترك تحديد المعايير لكل دولة", D: "عدم وجود ملحق فني", correct: "C", cat: "stcw" },
            { q: "ما هو الأثر الأساسي لتعديلات 1995؟", A: "إلغاء شهادات الملاحة", B: "إنشاء فصول جديدة", C: "معالجة التباين في مفهوم المتطلبات", D: "إضافة التدريب القطبي", correct: "C", cat: "stcw" },
            { q: "تنقسم الاتفاقية STCW إلى:", A: "5 فصول", B: "8 فصول", C: "10 فصول", D: "7 فصول", correct: "B", cat: "stcw" },
            { q: "ما هو الفرق بين الجزء A و B في STCW؟", A: "الجزء A أمان، B تدريب", B: "A إلزامي، B اختياري", C: "A للربان، B للمحرك", D: "A للضباط، B للبحارة", correct: "B", cat: "stcw" },
            { q: "كم عدد الوظائف الأساسية في STCW؟", A: "5", B: "7", C: "3", D: "8", correct: "B", cat: "stcw" },
            { q: "من يصنف ضمن مستوى الإدارة؟", A: "كل الضباط", B: "الربان وكبير المهندسين فقط", C: "المهندس الثالث", D: "البحري العادي", correct: "B", cat: "stcw" },
            { q: "في أي فصل نجد معايير الاتصالات الراديوية؟", A: "الفصل الثالث", B: "الفصل الرابع", C: "الفصل الخامس", D: "الفصل الثامن", correct: "B", cat: "stcw" },

            // MLC
            { q: "متى دخلت اتفاقية العمل البحري 2006 MLC حيز التنفيذ؟", A: "7 شباط 2006", B: "20 آب 2012", C: "20 آب 2013", D: "1 كانون الثاني 2010", correct: "C", cat: "mlc" },
            { q: "ما الجهة التي أعدت اتفاقية العمل البحري 2006 MLC؟", A: "المنظمة البحرية الدولية IMO", B: "منظمة العمل الدولية ILO", C: "هيئة الأمم المتحدة", D: "الاتحاد الدولي للبحارة", correct: "B", cat: "mlc" },
            { q: "ما هو المقصود بشهادة العمل البحري MLC؟", A: "شهادة تأمين بحري", B: "شهادة الصلاحية للإبحار", C: "Maritime Labour Certificate", D: "Document of Maritime Labour Compliance", correct: "C", cat: "mlc" },
            { q: "المبدأ المطبق على سفن الدول غير المصادقة في موانئ دول مصادقة؟", A: "مبدأ الدولة العلم", B: "مبدأ السيادة البحرية", C: "لا مزيد من التساهل (No More Favorable Treatment)", D: "الحصانة المينائية", correct: "C", cat: "mlc" },
            { q: "أي من اللوائح التالية تتعلق بـ 'أماكن الإقامة وتقديم الوجبات' في MLC؟", A: "الباب الأول", B: "الباب الثاني", C: "الباب الثالث", D: "الباب الخامس", correct: "C", cat: "mlc" },

            // MARPOL
            { q: "ما هو تاريخ دخول اتفاقية MARPOL حيز التنفيذ؟", A: "2 نوفمبر 1973", B: "2 أكتوبر 1983", C: "1 يوليو 1992", D: "19 مايو 2005", correct: "B", cat: "marpol" },
            { q: "أي مرفق يختص بمنع التلوث بالمواد الضارة السائلة المنقولة بكميات كبيرة؟", A: "المرفق الأول", B: "المرفق الثاني", C: "المرفق الثالث", D: "المرفق الرابع", correct: "B", cat: "marpol" },
            { q: "ما هي أهم ميزة في المرفق الخامس من اتفاقية MARPOL؟", A: "حظر تصريف مياه الصرف", B: "فرض أنظمة تغليف للمواد", C: "الحظر الكامل للتخلص من البلاستيك في البحر", D: "الحد من انبعاثات الكبريت", correct: "C", cat: "marpol" },
            { q: "ما الذي يغطيه المرفق السادس في اتفاقية MARPOL؟", A: "مياه الصرف الصحي", B: "المواد المغلفة", C: "التلوث النفطي", D: "تلوث الهواء", correct: "D", cat: "marpol" },
            { q: "ما السبب الرئيسي لاعتماد بروتوكول 1978 ضمن MARPOL؟", A: "التغيرات في أنظمة السلامة", B: "فشل اتفاقية 1954", C: "حوادث ناقلات النفط بين 1976-1977", D: "إدخال مرفقات جديدة", correct: "C", cat: "marpol" },

            // ISM
            { q: "ما الهدف من تعيين الشخص المعين (Designated Person) في نظام ISM؟", A: "الإشراف على المعدات", B: "التفتيش على الشهادات", C: "مراقبة السلامة ومنع التلوث وربط السفينة بالشركة", D: "إصدار رواتب الطاقم", correct: "C", cat: "ism" },
            { q: "من هو المسؤول عن التأكد من أن الربان مؤهل ومطلع على نظام SMS؟", A: "الإدارة البحرية", B: "المنظمة البحرية", C: "الشركة", D: "المهندس الأول", correct: "C", cat: "ism" },
            { q: "ما اسم الشهادة التي تمنح للسفينة بعد التحقق من امتثالها لنظام السلامة؟", A: "Ship Registration Certificate", B: "Safety Management Certificate", C: "Document of Compliance", D: "Pollution Control Certificate", correct: "B", cat: "ism" },
            { q: "وفقًا لمدونة ISM، ما هي مسؤولية الربان الأساسية؟", A: "قيادة السفينة فقط", B: "مراجعة وثائق الوقود", C: "تنفيذ سياسة السلامة وحماية البيئة وتحفيز الطاقم", D: "الحفاظ على الحضور اليومي", correct: "C", cat: "ism" },
            { q: "ما الذي يجب أن تحتويه وثائق إدارة السلامة؟", A: "أسماء الطاقم فقط", B: "مخطط التفتيش الجمركي", C: "الإجراءات والسياسات الخاصة بالسلامة", D: "تعليمات الترفيه والراحة", correct: "C", cat: "ism" }
        ];

        let currentQuizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let wrongScore = 0;
        let answered = false;
        let timerInterval = null;
        let timeRemaining = 0;
        let selectedCategory = 'all';

        const screens = {
            landing: document.getElementById('landing-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };
        const listItems = document.querySelectorAll('ul li');
        const answerEls = document.querySelectorAll('.answer');
        const submitBtn = document.getElementById('submit-btn');
        const barCorrect = document.getElementById('bar-correct');
        const barWrong = document.getElementById('bar-wrong');

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedCategory = e.target.getAttribute('data-cat');
            });
        });

        function startAssessment() {
            if (selectedCategory === 'all') {
                currentQuizData = [...fullQuizData];
            } else {
                currentQuizData = fullQuizData.filter(q => q.cat === selectedCategory);
            }

            const timeInput = document.getElementById('time-input').value;
            if (timeInput && timeInput > 0) {
                timeRemaining = parseInt(timeInput) * 60;
                document.getElementById('timer-display').style.display = 'block';
                timerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            } else {
                document.getElementById('timer-display').style.display = 'none';
            }

            switchScreen('quiz');
            loadQuestion();
        }

        function updateTimer() {
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                finishAssessment(true);
                return;
            }
            timeRemaining--;
            let m = Math.floor(timeRemaining / 60);
            let s = timeRemaining % 60;
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if (timeRemaining < 60) {
                timerEl.style.backgroundColor = 'rgba(255,69,58,0.3)';
                timerEl.style.color = '#ff453a';
                timerEl.style.animation = 'shake 1s infinite';
            }
        }

        function loadQuestion() {
            resetOptions();
            answered = false;
            submitBtn.innerText = "تأكيد الإجابة";
            document.getElementById('progress-text').innerText = `السؤال ${currentQuestionIndex + 1} من ${currentQuizData.length}`;
            
            const qData = currentQuizData[currentQuestionIndex];
            document.getElementById('question').innerText = qData.q;
            document.getElementById('a_text').innerText = qData.A;
            document.getElementById('b_text').innerText = qData.B;
            document.getElementById('c_text').innerText = qData.C;
            document.getElementById('d_text').innerText = qData.D;
        }

        function resetOptions() {
            answerEls.forEach(el => { el.checked = false; el.disabled = false; });
            listItems.forEach(item => {
                item.classList.remove('correct-answer', 'wrong-answer', 'disabled');
                item.style.border = '1px solid rgba(255, 255, 255, 0.08)';
            });
        }

        window.selectOption = function(id) {
            if(!answered) {
                document.getElementById(id).checked = true;
                listItems.forEach(item => item.style.border = '1px solid rgba(255, 255, 255, 0.08)');
                document.getElementById('li_' + id).style.border = '1px solid var(--accent-blue)';
            }
        };

        function getSelected() {
            let answer;
            answerEls.forEach(el => { if(el.checked) answer = el.id; });
            return answer;
        }

        submitBtn.addEventListener('click', () => {
            if (!answered) {
                const answer = getSelected();
                if(answer) {
                    const correctAnswer = currentQuizData[currentQuestionIndex].correct;
                    
                    if(answer === correctAnswer) {
                        score++;
                        document.getElementById('li_' + answer).classList.add('correct-answer');
                    } else {
                        wrongScore++;
                        document.getElementById('li_' + answer).classList.add('wrong-answer');
                        document.getElementById('li_' + correctAnswer).classList.add('correct-answer');
                    }
                    
                    let total = currentQuizData.length;
                    barCorrect.style.width = (score / total) * 100 + '%';
                    barWrong.style.width = (wrongScore / total) * 100 + '%';

                    listItems.forEach(item => item.classList.add('disabled'));
                    answerEls.forEach(el => el.disabled = true);

                    answered = true;
                    submitBtn.innerText = "السؤال التالي ➔";
                } else {
                    submitBtn.style.animation = 'shake 0.4s';
                    setTimeout(() => submitBtn.style.animation = '', 400);
                }
            } else {
                currentQuestionIndex++;
                if(currentQuestionIndex < currentQuizData.length) {
                    loadQuestion();
                } else {
                    finishAssessment(false);
                }
            }
        });

        function finishAssessment(timeOut = false) {
            if(timerInterval) clearInterval(timerInterval);
            
            switchScreen('result');
            
            const total = currentQuizData.length;
            const percentage = total === 0 ? 0 : (score / total) * 100;
            
            document.getElementById('res-total').innerText = total;
            document.getElementById('res-correct').innerText = score;
            document.getElementById('res-wrong').innerText = wrongScore;
            
            const pctEl = document.getElementById('final-percentage');
            pctEl.innerText = `%${percentage.toFixed(0)}`;
            
            if (timeOut) {
                document.getElementById('result-title').innerText = "⏰ انتهى الوقت!";
                document.getElementById('result-msg').innerText = "تم سحب ورقة الاختبار لانتهاء الوقت المحدد.";
            } else {
                document.getElementById('result-msg').innerText = percentage >= 60 ? "أداء ممتاز، كفاءة بحرية عالية!" : "تحتاج إلى مراجعة بعض المعلومات البحرية.";
            }

            pctEl.style.color = percentage >= 60 ? 'var(--success)' : 'var(--danger)';
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            wrongScore = 0;
            timeRemaining = 0;
            if (timerInterval) clearInterval(timerInterval);
            
            barCorrect.style.width = '0%';
            barWrong.style.width = '0%';
            document.getElementById('timer-display').style.display = 'none';
            document.getElementById('timer-display').style.backgroundColor = 'rgba(255,69,58,0.1)';
            document.getElementById('timer-display').style.color = 'var(--danger)';
            document.getElementById('timer-display').style.animation = 'none';

            switchScreen('landing');
        }

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }
    </script>
</body>
</html>
